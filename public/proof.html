<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet OS · Proof</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="data-shell"><header class="top"><div class="brand"><div class="brandmark"><i class="fa-solid fa-file-invoice"></i></div><div><h1>Fleet OS / Proof</h1><p>Delivery & service proof sheet</p></div></div><button class="ghost" id="printBtn" onclick="window.print()"><i class="fa-solid fa-print"></i> พิมพ์</button></header><section class="card"><div class="card-head"><div><h3>ใบงาน / หลักฐานงาน</h3><div class="sub">กรอกข้อมูลและแนบรูปเพื่อสร้างเอกสาร</div></div></div><div class="data-grid" style="grid-template-columns:repeat(3,1fr)"><input id="batch" type="hidden"><input id="ae" type="hidden"><input id="graphic" type="hidden"><input id="prodDate" type="hidden"><input id="dismantleDate" type="hidden"><input id="dismantleTime" type="hidden"><div class="field"><label class="label">เลขที่งาน</label><input class="input" id="jobName"></div><div class="field"><label class="label">ลูกค้า</label><input class="input" id="customer"></div><div class="field"><label class="label">วัสดุ / รายการ</label><input class="input" id="materialBody"></div><div class="field"><label class="label">วันที่สั่ง</label><input class="input" id="orderDateDisplay" type="date"></div><div class="field"><label class="label">วันที่ติดตั้ง</label><input class="input" id="installDate" type="date"></div><div class="field"><label class="label">เวลา</label><input class="input" id="installTime" type="time"></div></div><div class="section-tag">PHOTO PROOF</div><div class="upload" id="imageDropArea"><input id="fileInput" type="file" accept="image/*"><div id="imagePlaceholder" class="sub">เลือกภาพหลักฐาน</div><div id="previewContainer" style="display:none;margin-top:12px"><img id="previewImage" style="max-width:100%;max-height:360px;border-radius:16px" alt="proof"></div><button class="secondary remove-image-btn" id="removeImageBtn" type="button" style="margin-top:10px" onclick="hideImage()">ลบรูป</button></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="primary" style="width:auto;padding-inline:24px" id="addRowBtn" type="button">เพิ่มรายการ</button></div></section></div><script src="/proof.js"></script></body></html>
