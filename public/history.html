<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สมุดบันทึกการใช้รถ</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B2D;--mut:#52627A;--line:#E2E8F0;--bg:#F3F5F8;--pri:#1D4ED8;--tint:#E8EEFC;--ok:#0E7A4B;--okT:#E3F4EB;--am:#9A5B00;--amT:#FFF0D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Anuphan',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}h1,h2,.h{font-family:'Prompt',sans-serif;font-weight:600}
.w{max-width:1120px;margin:0 auto;padding:0 16px}
.hero{background:#fff;border-bottom:1px solid var(--line)}
.hero .w{padding-top:26px;padding-bottom:22px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.hero h1{font-size:34px;line-height:1.15;letter-spacing:-.01em}.hero .eye{font-size:13px;color:var(--pri);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.hero .sp{flex:1}
.btn{height:42px;padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:600 14px 'Prompt',sans-serif;cursor:pointer;transition:transform .15s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(15,27,45,.22)}.btn:active{transform:scale(.97)}
.ghost{background:#fff;color:var(--ink);border:1.5px solid #CBD5E1}.ghost:hover{box-shadow:none;background:var(--bg)}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:4px;gap:2px}.seg button{height:34px;padding:0 14px;border:0;border-radius:9px;background:none;font:600 13px 'Anuphan',sans-serif;color:var(--mut);cursor:pointer;transition:.2s}.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,27,45,.15)}
.sec{margin-top:20px}.sec>h2{font-size:15px;color:var(--mut);margin-bottom:10px;display:flex;gap:10px;align-items:center;font-weight:600}.sec>h2 small{font:400 12px 'Anuphan',sans-serif}
.fleet{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.fc{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;transition:transform .2s,box-shadow .2s;animation:rise .5s ease-out both}.fc:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,27,45,.09)}
.fh{display:flex;justify-content:space-between;align-items:center;gap:6px}.fh b{font:600 15px 'Prompt',sans-serif}
.plate{background:#fff;border:2px solid var(--ink);border-radius:7px;font:600 13px 'Prompt',sans-serif;padding:0 7px;white-space:nowrap}
.free,.busy{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}.free{color:var(--ok)}.busy{color:var(--am)}
.free i,.busy i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}.busy i{animation:pulse 1.8s ease-out infinite}
.sm{font-size:12px}.mut{color:var(--mut)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:16px}
.kpi div{padding:16px 18px;border-right:1px solid var(--line)}.kpi div:last-child{border:0}
.kpi .n{font:700 30px 'Prompt',sans-serif;font-variant-numeric:tabular-nums;line-height:1.2}.kpi .l{font-size:13px;color:var(--mut)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:#EEF1F6;animation:pop .4s ease-out both;transition:transform .15s}.heat i:hover{transform:scale(1.4)}.heat i.x{visibility:hidden}
.l1{background:#C9D8FA!important}.l2{background:#93AEF0!important}.l3{background:#4F7BE5!important}.l4{background:#1D4ED8!important}
.lg{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--mut)}.lg i{width:12px;height:12px;border-radius:3px;background:#EEF1F6}
.ln{display:flex;flex-direction:column;gap:12px}.ln div b{display:flex;justify-content:space-between;font-size:14px;font-weight:600}.ln em{font-style:normal;color:var(--mut);font-weight:400}.ln s{display:block;height:8px;border-radius:4px;background:#EEF1F6;margin-top:5px;overflow:hidden}.ln s i{display:block;height:100%;border-radius:4px;background:var(--c);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{height:44px;border:1.5px solid #CBD5E1;border-radius:12px;padding:0 14px;font:inherit;font-size:15px;color:var(--ink);background:#fff;flex:1;min-width:200px;transition:.2s}input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px #DCE6FB}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips button{height:34px;padding:0 12px;border-radius:999px;border:1.5px solid #CBD5E1;background:#fff;font:600 13px 'Anuphan',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}.chips button i{width:9px;height:9px;border-radius:50%;background:var(--c,#52627A)}.chips button:hover{border-color:var(--ink)}.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.day{position:sticky;top:0;z-index:2;background:var(--bg);padding:16px 0 8px;font:600 14px 'Prompt',sans-serif;display:flex;gap:10px;align-items:center}.day small{font:400 12px 'Anuphan',sans-serif;color:var(--mut)}
.ev{display:grid;grid-template-columns:48px 16px 1fr;gap:8px;animation:rise .45s ease-out both}
.tm{text-align:right;font-size:13px;color:var(--mut);padding-top:14px;font-variant-numeric:tabular-nums}
.rail{position:relative}.rail::before{content:"";position:absolute;left:7px;top:0;bottom:-10px;width:2px;background:var(--line)}.rail i{position:absolute;left:1px;top:17px;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--c)}
.it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;transition:transform .2s,box-shadow .2s,border-color .2s;text-align:left;width:100%;font:inherit;color:inherit}.it:hover{transform:translateX(4px);box-shadow:0 8px 20px rgba(15,27,45,.08);border-color:var(--c)}
.av{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--pri);font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.it b{font-weight:600}.it .mut{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}.chip.ok{background:var(--okT);color:#0B6B42}.chip.am{background:var(--amT);color:var(--am)}.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.more{display:block;margin:12px auto 0}
.empty{text-align:center;padding:48px 16px;color:var(--mut)}.empty b{display:block;font-size:40px}
.sk{height:64px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,#E9EDF3 25%,#F6F8FB 50%,#E9EDF3 75%);background-size:200% 100%;animation:sh 1.4s infinite}
.ov{position:fixed;inset:0;z-index:30;background:rgba(15,27,45,.45);opacity:0;pointer-events:none;transition:.25s}.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:31;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow:auto;box-shadow:-10px 0 30px rgba(15,27,45,.15)}.dr.on{transform:none}
.dh{background:var(--c,#1D4ED8);color:#fff;padding:22px 20px;display:flex;gap:12px;align-items:flex-start}.dh h2{flex:1;font-size:20px;color:#fff}.dh small{opacity:.9;font-size:13px;display:block;font-family:'Anuphan'}
.x{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer}
.db{padding:18px 20px 32px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.f{background:var(--bg);border-radius:12px;padding:10px 12px}.f small{display:block;font-size:12px;color:var(--mut)}.f b{font-weight:600;word-break:break-word}.f.w2{grid-column:1/-1}
.db img{width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin-top:6px;cursor:zoom-in}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:40}#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}@keyframes sh{to{background-position:-200% 0}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(154,91,0,.5)}100%{box-shadow:0 0 0 7px rgba(154,91,0,0)}}
@media(max-width:900px){.fleet{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.fc{min-width:170px;scroll-snap-align:start}.two{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}.kpi div:nth-child(2){border-right:0}.kpi div:nth-child(-n+2){border-bottom:1px solid var(--line)}.hero h1{font-size:28px}}
@media(max-width:560px){.ev{grid-template-columns:0 14px 1fr}.tm{display:none}.it{grid-template-columns:auto 1fr}.it .chip{grid-column:1/-1;justify-self:start}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#sp{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--pri);transform-origin:left;transform:scaleX(0);z-index:60}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.hero .w>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}.hero .w>:nth-child(2){animation-delay:.08s}.hero .w>:nth-child(3){animation-delay:.14s}.hero .w>:nth-child(4){animation-delay:.2s}.hero .w>:nth-child(5){animation-delay:.26s}
.road{flex:0 0 100%;position:relative;height:34px;overflow:hidden}
.road .dash{position:absolute;left:0;right:0;bottom:6px;height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,#CBD5E1 0 18px,transparent 18px 36px);background-size:36px 3px;animation:dash 1.2s linear infinite}
.road .cr{position:absolute;bottom:8px;left:-50px;font-size:26px;transform:scaleX(-1);animation:drive 11s linear infinite;filter:drop-shadow(0 4px 3px rgba(15,27,45,.2))}
.fc{transition:transform .18s ease-out,box-shadow .2s;will-change:transform}
.fc.bz{animation:rise .5s ease-out both,glow 2.6s ease-in-out 1s infinite}
.ln s i{position:relative;overflow:hidden}.ln s i::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.4);transform:translateX(-100%);animation:sweep 2.8s ease-in-out infinite}
.heat i{cursor:default}.ev:hover .rail i{transform:scale(1.35)}.rail i{transition:transform .2s}
.seg{position:relative}.seg .pl{position:absolute;top:4px;bottom:4px;left:0;width:0;background:#fff;border-radius:9px;box-shadow:0 1px 5px rgba(15,27,45,.18);transition:transform .38s cubic-bezier(.3,1.4,.5,1),width .38s}
.seg button{position:relative;z-index:1}.seg button[aria-pressed=true]{background:none;box-shadow:none;color:var(--ink)}
.btn,.chips button,.seg button,.more{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}
.chips button:active{transform:scale(.94)}
#tp{position:fixed;right:20px;bottom:24px;width:46px;height:46px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:20px;cursor:pointer;opacity:0;transform:translateY(16px) scale(.8);pointer-events:none;transition:.3s;z-index:35;box-shadow:0 8px 20px rgba(15,27,45,.3)}#tp.on{opacity:1;transform:none;pointer-events:auto}#tp:hover{transform:translateY(-3px)}
.db .f{animation:rise .45s ease-out both}.db .f:nth-child(1){animation-delay:125ms}.db .f:nth-child(2){animation-delay:170ms}.db .f:nth-child(3){animation-delay:215ms}.db .f:nth-child(4){animation-delay:260ms}.db .f:nth-child(5){animation-delay:305ms}.db .f:nth-child(6){animation-delay:350ms}.db .f:nth-child(7){animation-delay:395ms}.db .f:nth-child(8){animation-delay:440ms}.db .f:nth-child(9){animation-delay:485ms}.db .f:nth-child(10){animation-delay:530ms}
@keyframes dash{to{background-position:-36px 0}}@keyframes drive{from{left:-50px}to{left:100%}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(154,91,0,0)}50%{box-shadow:0 0 0 6px rgba(154,91,0,.14)}}
@keyframes sweep{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}@keyframes rpl{to{transform:scale(3.2);opacity:0}}
</style>
</head>
<body>
<header class="hero"><div class="w"><div><div class="eye">FLEET LOGBOOK</div><h1>สมุดบันทึกการใช้รถ</h1><p class="mut" id="upd">กำลังโหลด...</p></div><div class="sp"></div><div class="seg" id="per" role="group" aria-label="ช่วงเวลา"><i class="pl"></i><button data-d="7">7 วัน</button><button data-d="30" aria-pressed="true">30 วัน</button><button data-d="90">90 วัน</button><button data-d="0">ทั้งหมด</button></div><button class="btn ghost" id="rf">รีเฟรช</button><button class="btn" id="ex">ส่งออก CSV</button><div class="road" aria-hidden="true"><div class="dash"></div><span class="cr">🚗</span></div></div></header>
<main class="w" style="padding-bottom:56px">
<section class="sec"><h2>ตอนนี้ <small>สถานะรถแต่ละคัน</small></h2><div class="fleet" id="fl"></div></section>
<section class="sec"><div class="kpi"><div><div class="n" id="k1">-</div><div class="l">จำนวนเที่ยว</div></div><div><div class="n" id="k2">-</div><div class="l">ระยะทางรวม (กม.)</div></div><div><div class="n" id="k3">-</div><div class="l">กำลังใช้งานอยู่ (คัน)</div></div><div><div class="n" id="k4">-</div><div class="l">ผู้ใช้งาน (คน)</div></div></div></section>
<section class="sec two"><div class="card"><h2 style="font-size:15px;margin-bottom:12px">ความถี่การใช้รถ 13 สัปดาห์ล่าสุด</h2><div class="heat" id="ht"></div><div class="lg">น้อย <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> มาก</div></div><div class="card"><h2 style="font-size:15px;margin-bottom:14px">สัดส่วนตามรถ <small class="mut" style="font:400 12px 'Anuphan'">ตามช่วงเวลาที่เลือก</small></h2><div class="ln" id="ln"></div></div></section>
<section class="sec"><h2>ไทม์ไลน์การใช้งาน <small id="cnt"></small></h2>
<div class="tools"><input id="q" placeholder="ค้นหาชื่อ ทะเบียน สาเหตุ แผนก..." aria-label="ค้นหา"></div>
<div class="chips" id="cc" role="group" aria-label="กรองรถ"></div><div class="chips" id="sc" role="group" aria-label="กรองสถานะ"><button data-s="" aria-pressed="true">ทุกสถานะ</button><button data-s="pending">กำลังใช้อยู่</button><button data-s="returned">คืนรถแล้ว</button></div>
<div id="fd"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><button class="btn ghost more" id="mo" style="display:none"></button></section>
</main>
<div class="ov" id="ov"></div><aside class="dr" id="dr" role="dialog" aria-modal="true" aria-label="รายละเอียด"><div class="dh" id="dh"></div><div class="db" id="db"></div></aside>
<div id="sp"></div><button id="tp" aria-label="กลับขึ้นบน">↑</button><div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id),STEP=25;
const CARS=[['Nissan','ผอ 5757','#2563EB'],['Mazda','ยค 3777','#D9480F'],['MG','งบ 255','#0F766E'],['Click','จงจ 222','#7C3AED'],['Fino','งธท 222','#B45309']];
let all=[],base=[],list=[],days=30,carF='',stF='',q='',shown=STEP;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=r=>String(r.car||'').split(':')[0].trim(),pl=r=>String(r.car||'').split(':')[1]?.trim()||'—';
const col=n=>(CARS.find(c=>c[0]===n)||[0,0,'#52627A'])[2],done=r=>r.returnStatus==='returned';
const ymd=d=>new Date(d).toLocaleDateString('sv-SE');
const hm=s=>s?new Date(s).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'—';
const dt=s=>s?new Date(s).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
function av(r){const n=r.name||'?',a=document.createElement('span');a.className='av';if(r.pictureUrl){const i=new Image();i.src=r.pictureUrl;i.alt='';i.referrerPolicy='no-referrer';i.onerror=()=>{a.textContent=n.charAt(0)};a.appendChild(i)}else a.textContent=n.charAt(0);return a.outerHTML}
function count(el,to,dec){const t0=performance.now(),f=x=>{const p=Math.min(1,(x-t0)/700),v=to*(1-Math.pow(1-p,3));el.textContent=v.toLocaleString('th-TH',{maximumFractionDigits:dec||0,minimumFractionDigits:dec||0});if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
async function load(){try{const d=await fetch('/get-records').then(r=>{if(!r.ok)throw 0;return r.json()});all=d.records||[];fleet();heat();recalc();$('upd').textContent='อัปเดตล่าสุด '+hm(new Date())+' น. · '+all.length+' รายการ'}
catch{$('fd').innerHTML='<div class="empty"><b>⚠️</b>โหลดข้อมูลไม่สำเร็จ กรุณากดรีเฟรช</div>';$('upd').textContent='โหลดไม่สำเร็จ'}}
function fleet(){$('fl').innerHTML=CARS.map(([n,p,c],i)=>{const a=all.find(r=>nm(r)===n&&!done(r));return `<div class="fc${a?' bz':''}" style="--c:${c};animation-delay:${i*60}ms"><div class="fh"><b>${n}</b><span class="plate">${p}</span></div>${a?`<div class="busy"><i></i>กำลังใช้ · ${esc(a.name||'—')}</div><div class="mut sm">ตั้งแต่ ${ymd(a.timestamp)===ymd(new Date())?'':new Date(a.timestamp).toLocaleDateString('th-TH',{day:'numeric',month:'short'})+' '}${hm(a.timestamp)} น.</div>`:`<div class="free"><i></i>ว่าง พร้อมใช้</div><div class="mut sm">&nbsp;</div>`}</div>`}).join('')}
function heat(){const cnt={};all.forEach(r=>{if(r.timestamp){const k=ymd(r.timestamp);cnt[k]=(cnt[k]||0)+1}});const now=new Date(),end=new Date(now.getFullYear(),now.getMonth(),now.getDate()),start=new Date(end);start.setDate(end.getDate()-end.getDay()-12*7);
const mx=Math.max(1,...Object.values(cnt));let h='';for(let i=0;i<91;i++){const d=new Date(start);d.setDate(start.getDate()+i);if(d>end){h+='<i class="x"></i>';continue}const k=ymd(d),n=cnt[k]||0,l=n?Math.min(4,Math.ceil(n/mx*4)):0;h+=`<i class="${l?'l'+l:''}" title="${d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})}: ${n} เที่ยว" style="animation-delay:${i*6}ms"></i>`}$('ht').innerHTML=h}
function recalc(){const lim=days?Date.now()-days*864e5:0;base=all.filter(r=>!lim||(r.timestamp&&new Date(r.timestamp)>=lim));
count($('k1'),base.length);count($('k2'),base.reduce((s,r)=>s+(+r.totalDistance||0),0),1);count($('k3'),all.filter(r=>!done(r)).length);count($('k4'),new Set(base.map(r=>r.userId||r.name)).size);
const per=CARS.map(([n,p,c])=>{const rs=base.filter(r=>nm(r)===n);return{n,c,t:rs.length,km:rs.reduce((s,r)=>s+(+r.totalDistance||0),0)}}),mx=Math.max(1,...per.map(x=>x.t));
$('ln').innerHTML=per.map(x=>`<div style="--c:${x.c}"><b>${x.n}<em>${x.t} เที่ยว · ${x.km.toLocaleString('th-TH',{maximumFractionDigits:0})} กม.</em></b><s><i style="width:0" data-w="${x.t/mx*100}"></i></s></div>`).join('');
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%')));
$('cc').innerHTML='<button data-c="" aria-pressed="'+(carF===''?'true':'false')+'">ทุกคัน</button>'+CARS.map(([n,p,c])=>`<button data-c="${n}" style="--c:${c}" aria-pressed="${carF===n}"><i></i>${n}</button>`).join('');
$('cc').querySelectorAll('button').forEach(b=>b.onclick=()=>{carF=b.dataset.c;recalc()});filt()}
function filt(){const s=q.toLowerCase();list=base.filter(r=>(!carF||nm(r)===carF)&&(!stF||(stF==='returned')===done(r))&&(!s||[r.name,r.car,r.reason,r.department].some(v=>String(v||'').toLowerCase().includes(s))));shown=STEP;feed()}
function dayLabel(k){const t=ymd(new Date()),y=ymd(new Date(Date.now()-864e5));return k===t?'วันนี้':k===y?'เมื่อวาน':new Date(k+'T00:00').toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'})}
function feed(){$('cnt').textContent=list.length+' รายการ';if(!list.length){$('fd').innerHTML='<div class="empty"><b>📭</b>ไม่พบรายการที่ตรงกับตัวกรอง</div>';$('mo').style.display='none';return}
const rs=list.slice(0,shown);let cur='',h='';rs.forEach((r,i)=>{const k=r.timestamp?ymd(r.timestamp):'—';if(k!==cur){cur=k;const n=rs.filter(x=>(x.timestamp?ymd(x.timestamp):'—')===k).length;h+=`<div class="day">${k==='—'?'ไม่ระบุวันที่':dayLabel(k)}<small>${n} เที่ยว</small></div>`}
const c=col(nm(r));h+=`<div class="ev" style="animation-delay:${Math.min(i,12)*30}ms"><div class="tm">${hm(r.timestamp)}</div><div class="rail" style="--c:${c}"><i></i></div><button class="it" style="--c:${c}" data-i="${all.indexOf(r)}">${av(r)}<span style="min-width:0"><b>${esc(r.name||'—')}</b> <span class="plate" style="font-size:12px">${esc(pl(r))}</span><span class="mut">${esc(r.reason||'—')}${r.totalDistance?' · '+(+r.totalDistance).toFixed(1)+' กม.':''}${done(r)&&r.durationText?' · '+esc(r.durationText):''}</span></span>${done(r)?'<span class="chip ok"><i></i>คืนแล้ว</span>':'<span class="chip am"><i></i>กำลังใช้อยู่</span>'}</button></div>`});
$('fd').innerHTML=h;$('fd').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>detail(all[b.dataset.i]));const left=list.length-shown;$('mo').style.display=left>0?'block':'none';$('mo').textContent='แสดงเพิ่มอีก '+Math.min(STEP,left)+' รายการ'}
$('mo').onclick=()=>{shown+=STEP;feed()};
function detail(r){if(!r)return;const c=col(nm(r)),l=r.returnLocation,f=(a,b,w)=>`<div class="f${w?' w2':''}"><small>${a}</small><b>${b}</b></div>`;
$('dr').style.setProperty('--c',c);$('dh').innerHTML=`<div style="flex:1"><h2>${esc(r.name||'—')}</h2><small>${esc(r.car||'—')}</small></div><button class="x" id="xx" aria-label="ปิด">✕</button>`;
$('db').innerHTML=f('เบอร์โทร',esc(r.phone||'—'))+f('แผนก',esc(r.department||'—'))+f('เลขไมล์',esc(r.mileage||'—'))+f('สถานะ',done(r)?'คืนรถแล้ว':'กำลังใช้อยู่')+f('สาเหตุ',esc(r.reason||'—'),1)+f('เส้นทาง',esc(r.routeText||'—'),1)+f('เริ่มใช้รถ',dt(r.timestamp),1)+(done(r)?f('คืนรถเมื่อ',dt(r.returnedAt))+f('ระยะเวลา',esc(r.durationText||'—')):'')+
(l&&l.lat!=null?f('ตำแหน่งตอนคืนรถ','<a href="https://www.google.com/maps?q='+encodeURIComponent(l.lat+','+l.lng)+'" target="_blank" rel="noopener" style="color:var(--pri)">ดูบนแผนที่ ±'+Math.round(l.accuracy||0)+' ม.</a>',1):'')+
(r.photoKey?'<div class="f w2"><small>รูปเลขไมล์ (แตะเพื่อขยาย)</small><img src="/get-photo?key='+encodeURIComponent(r.photoKey)+'" alt="รูปเลขไมล์" loading="lazy" onclick="this.style.maxHeight=this.style.maxHeight===\'none\'?\'280px\':\'none\'"></div>':'');
$('dr').classList.add('on');$('ov').classList.add('on');$('xx').onclick=close;$('xx').focus()}
const close=()=>{$('dr').classList.remove('on');$('ov').classList.remove('on')};$('ov').onclick=close;document.onkeydown=e=>{if(e.key==='Escape')close()};
$('per').querySelectorAll('button').forEach(b=>b.onclick=()=>{days=+b.dataset.d;$('per').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));recalc()});
$('sc').querySelectorAll('button').forEach(b=>b.onclick=()=>{stF=b.dataset.s;$('sc').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));filt()});
let db;$('q').oninput=e=>{clearTimeout(db);db=setTimeout(()=>{q=e.target.value.trim();filt()},200)};
$('rf').onclick=()=>{load();toast('รีเฟรชข้อมูลแล้ว')};
$('ex').onclick=()=>{if(!list.length)return toast('ไม่มีข้อมูลให้ส่งออก');const c=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
const rows=[['ผู้ใช้','แผนก','ทะเบียนรถ','เลขไมล์','สาเหตุ','เริ่มใช้รถ','สถานะ','คืนรถเมื่อ','ระยะเวลา','ระยะทาง (กม.)']].concat(list.map(r=>[r.name,r.department,r.car,r.mileage,r.reason,dt(r.timestamp),done(r)?'คืนรถแล้ว':'กำลังใช้อยู่',done(r)?dt(r.returnedAt):'',r.durationText,r.totalDistance]));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(c).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='ประวัติการใช้รถ.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
/* effects */
function pill(){const b=$('per').querySelector('[aria-pressed=true]'),p=$('per').querySelector('.pl');if(b&&p){p.style.width=b.offsetWidth+'px';p.style.transform='translateX('+b.offsetLeft+'px)'}}
$('per').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>requestAnimationFrame(pill)));
addEventListener('resize',pill);pill();if(document.fonts)document.fonts.ready.then(pill);
document.addEventListener('mousedown',e=>{const t=e.target.closest('.btn,.chips button,.seg button,.more');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height),x=document.createElement('span');x.className='rp';x.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';t.appendChild(x);setTimeout(()=>x.remove(),650)});
const fh=matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches;
if(fh){$('fl').addEventListener('mousemove',e=>{const c=e.target.closest('.fc');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform='perspective(600px) rotateX('+(-y*8)+'deg) rotateY('+(x*10)+'deg) translateY(-3px)'});
$('fl').addEventListener('mouseout',e=>{const c=e.target.closest('.fc');if(c&&!c.contains(e.relatedTarget))c.style.transform=''})}
document.querySelectorAll('.sec').forEach(el=>el.classList.add('rv'));
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.04});document.querySelectorAll('.rv').forEach(el=>io.observe(el))}else document.querySelectorAll('.rv').forEach(el=>el.classList.add('in'));
addEventListener('scroll',()=>{const h=document.documentElement,m=h.scrollHeight-h.clientHeight;$('sp').style.transform='scaleX('+(m>0?h.scrollTop/m:0)+')';$('tp').classList.toggle('on',h.scrollTop>400)},{passive:true});
$('tp').onclick=()=>scrollTo({top:0,behavior:'smooth'});
load();
</script>
</body>
